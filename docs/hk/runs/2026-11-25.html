const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v === null || v === undefined ? "–" : `${v > 0 ? "+" : ""}${v.toFixed(1)}%`;
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const numf = (v, d=2) => v === null || v === undefined ? "–" : v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const TABS = [{key:"open",title:"Pre-open"},{key:"close",title:"Close"},{key:"watchlist",title:"Watchlist"}];
const latest = DATA.sessions.close || DATA.sessions.open;

document.getElementById("meta").textContent = `${DATA.dateLabel} · ${DATA.count} Hong Kong names · Source: LSEG Workspace`;
const runs = document.getElementById("runs");
runs.innerHTML = DATA.runs.map((r,i) => `<option value="${r.href}" ${r.date===DATA.date?"selected":""}>${r.date}${i===0?" (latest)":""}</option>`).join("");
runs.onchange = () => { location.href = runs.value + location.hash; };

function nav(active){
  document.getElementById("nav").innerHTML = TABS.map(t => {
    const off = (t.key === "open" || t.key === "close") && !DATA.sessions[t.key];
    return `<a href="#${t.key}" class="${t.key===active?"active":""}" style="${off?"opacity:.45":""}">${t.title}</a>`;
  }).join("") + `<a href="${DATA.screens}" style="margin-left:auto">Global Screens →</a>`;
}

function tiles(macro){
  return `<div class="tiles">${macro.map(m => `<div class="tile"><div class="k">${esc(m.name)}</div>
    <div class="v">${m.last===null?"–":numf(m.last, m.last<20?3:1)}</div><div class="c ${cls(m.chg)}">${pct(m.chg)}</div></div>`).join("")}</div>`;
}
const list = items => items && items.length ? `<ul>${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>` : `<p class="thesis">Nothing notable.</p>`;
const newsList = items => items && items.length ? `<ul class="news">${items.map(n=>`<li><span class="t">${esc(n.time)}</span><span>${esc(n.headline)}<span class="s">${esc(n.source)}</span></span></li>`).join("")}</ul>` : `<p class="thesis">No headlines in this window.</p>`;

function brief(key){
  const b = DATA.sessions[key];
  if(!b) return `<div class="empty">The ${key === "open" ? "pre-open brief" : "close wrap"} for ${esc(DATA.date)} hasn't been run yet.<br>Run <code>python screener.py --hk ${key} --publish</code>.</div>`;
  const c = b.commentary, byRic = Object.fromEntries(b.stocks.map(s => [s.ric, s]));
  const src = b.commentary_source === "rules" ? "Automatic summary (no LLM)" : `Commentary: ${esc(b.commentary_source)}`;
  const notes = c.stocks.map(n => { const s = byRic[n.ric] || {}; const move = key === "open" && s.proxy_chg !== null && s.proxy_chg !== undefined ? s.proxy_chg : s.chg_1d;
    return `<div class="note"><span><span class="nm">${esc(s.name || n.ric)}</span><span class="cd">${esc(n.ric)}${key==="open" && s.proxy_name ? " · " + esc(s.proxy_name) : ""}</span></span>
      <span class="ch ${cls(move)}">${pct(move)}</span><span class="tx">${esc(n.note)}</span></div>`; }).join("");
  const withNews = b.stocks.filter(s => s.news && s.news.length);
  const implied = key === "open" && b.implied_open_pct !== null ? ` · HSI futures imply <span class="${cls(b.implied_open_pct)}">${pct(b.implied_open_pct)}</span> open` : "";
  return `<p class="headline">${esc(c.headline)}</p>
    <div class="stamp">${key==="open"?"Pre-open brief":"Close wrap"} · ${esc(b.generated_at)}${implied}<span class="src">${src}</span>
      ${b.pdf ? `<button class="pdf-btn" onclick="downloadPdf('${key}')">Download PDF</button>` : ""}</div>
    ${tiles(b.macro)}
    <div class="grid2">
      <div>
        <div class="panel"><h3>${key==="open"?"Overnight":"Session"}</h3>${list(c.summary)}</div>
        <div class="panel"><h3>World &amp; China</h3>${list(c.world)}</div>
        <div class="panel"><h3>${key==="open"?"Watch today":"Watch overnight"}</h3>${list(c.watch)}</div>
      </div>
      <div class="panel"><h3>Stock notes</h3>${notes || `<p class="thesis">No stock-specific moves or news worth flagging.</p>`}</div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>World headlines</h3>${newsList(b.world_news.slice(0,12))}</div>
      <div class="panel"><h3>China &amp; HK headlines</h3>${newsList(b.china_news.slice(0,12))}</div>
    </div>
    <div class="panel stock-news"><h3>Company headlines</h3>${withNews.length ? withNews.map(s => `<h4>${esc(s.name)} <span class="s" style="color:var(--faint);font-weight:400">${esc(s.ric)}</span></h4>${newsList(s.news)}`).join("") : `<p class="thesis">No company headlines in this window.</p>`}</div>`;
}

  {k:"proxy_chg",l:"US proxy o/n",t:"pct"},{k:"pe",l:"P/E",t:"num",d:1},{k:"div_yield",l:"Div yld %",t:"num",d:1},
  {k:"holder",l:"Largest holder",t:"text"},{k:"holder_pct",l:"Holder %",t:"num",d:1},
  {k:"newsCount",l:"News",t:"num",d:0}];
const ws = {col:5, dir:"desc", q:""};
function watchlist(){
  if(!latest) return `<div class="empty">No data yet.</div>`;
  return `<div class="toolbar"><input id="q" type="search" placeholder="Search name, code, country, sector, holder…" value="${esc(ws.q)}">
    <span class="count" id="count"></span></div><div class="table-wrap" id="table"></div>
    <div class="notes">From the ${latest === DATA.sessions.close ? "close" : "pre-open"} run, ${esc(latest.generated_at)}. "US proxy o/n" is the overnight move in the US-listed shares or US parent. 52W range %: 0 = at the 52-week low, 100 = at the high.</div>`;
}
function renderTable(){
  const q = ws.q.toLowerCase(), c = COLS[ws.col], k = ws.dir === "asc" ? 1 : -1;
  const rows = latest.stocks.map(s => ({...s, newsCount: (s.news||[]).length}))
    .filter(s => !q || [s.name,s.ric,s.code,s.country,s.sector,s.holder].some(v => String(v||"").toLowerCase().includes(q)))
    .sort((a,b) => { const x=a[c.k], y=b[c.k]; if(x===null||x===undefined||x==="") return 1; if(y===null||y===undefined||y==="") return -1;
      return (c.t==="text" ? String(x).localeCompare(String(y)) : x-y) * k; });
  document.getElementById("count").textContent = `${rows.length} of ${latest.stocks.length} stocks`;
  const head = COLS.map((col,i) => `<th data-i="${i}" class="${col.t!=="text"?"num":""} ${i===ws.col?"sorted":""}">${col.l}<span class="arrow">${i===ws.col?(ws.dir==="asc"?"▲":"▼"):"↕"}</span></th>`).join("");
  const body = rows.map(s => `<tr>${COLS.map(col => { const v = s[col.k];
    if(col.t==="text") return `<td>${esc(v||"–")}</td>`;
    if(col.t==="pct") return `<td class="num ${cls(v)}">${pct(v)}</td>`;
    if(col.t==="price") return `<td class="num ${v===null||v===undefined?"na":""}">${v===null||v===undefined?"–":(+v).toLocaleString("en-US",{maximumFractionDigits: v < 10 ? 3 : 1, minimumFractionDigits: 1})}</td>`;
    return `<td class="num ${v===null||v===undefined?"na":""}">${numf(v, col.d)}</td>`; }).join("")}</tr>`).join("");
  document.getElementById("table").innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  document.querySelectorAll("th").forEach(th => th.onclick = () => { const i=+th.dataset.i;
    if(ws.col===i) ws.dir = ws.dir==="asc"?"desc":"asc"; else { ws.col=i; ws.dir = COLS[i].t==="text"?"asc":"desc"; } renderTable(); });
}

function downloadPdf(key){
  const p = DATA.sessions[key].pdf, bin = atob(p.b64), bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], {type:"application/pdf"}));
  a.download = p.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function route(){
  let key = location.hash.slice(1);
  if(!TABS.some(t => t.key === key)) key = DATA.sessions.close ? "close" : "open";
  nav(key);
  const main = document.getElementById("main");
  if(key === "watchlist"){ main.innerHTML = watchlist(); if(latest){ document.getElementById("q").oninput = e => { ws.q = e.target.value; renderTable(); }; renderTable(); } }
  else main.innerHTML = brief(key);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
