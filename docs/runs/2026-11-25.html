<head>

<title>Equity Screens &amp; HK Watchlist · 25 November 2026</title>
<style>

:root{--bg:#000;--panel:#101010;--panel2:#161616;--raise:#1c1c1c;--line:#2a2a2a;--amber:#fb8b1e;--amber-dim:#c96f12;--amber-soft:rgba(251,139,30,.12);--text:#e8e8e8;--muted:#9a9a9a;--faint:#5c5c5c;--blue:#4da3ff;--neg:#ff433d}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
header{background:var(--panel);border-bottom:2px solid var(--amber)}
.wrap{max-width:1640px;margin:0 auto;padding:0 32px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:20px}
h1{margin:0;font-size:21px;font-weight:650;letter-spacing:.01em;color:var(--amber)}
.meta{color:var(--muted);font-size:12.5px;margin-top:4px}
.runs{color:var(--muted);font-size:12.5px}
.runs select{margin-left:6px;background:var(--raise);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:4px 8px;font:inherit}
nav{display:flex;gap:2px;margin-top:18px;overflow-x:auto}
nav a{color:var(--muted);text-decoration:none;padding:9px 16px;font-weight:550;border-radius:3px 3px 0 0;white-space:nowrap}
nav a:hover{color:var(--text)}
nav a.active{background:var(--amber);color:#000}
nav .n{display:inline-block;min-width:22px;margin-left:6px;padding:0 6px;border-radius:9px;background:var(--raise);color:var(--muted);font-size:11.5px;text-align:center}
nav a.active .n{background:rgba(0,0,0,.18);color:#000}
main.wrap{padding-top:28px;padding-bottom:48px}
h2{margin:0 0 4px;font-size:19px;color:var(--text)}
.thesis{color:var(--muted);margin:0 0 12px;max-width:820px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--amber);border-radius:4px;padding:20px 22px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,background .15s}
.card:hover{background:var(--panel2);border-color:var(--amber-dim)}
.card h3{margin:0;font-size:15px;color:var(--text);letter-spacing:.01em}
.card .num{font-size:34px;font-weight:650;color:var(--amber);line-height:1;font-variant-numeric:tabular-nums}
.card .num small{font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.card .top-names{font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.card .top-names b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.card .open{margin-top:auto;color:var(--blue);font-weight:550;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--amber-soft);color:var(--amber);border:1px solid rgba(251,139,30,.35);border-radius:3px;padding:2px 9px;font-size:12.5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:7px 10px;font:inherit;color:var(--text)}
.toolbar input::placeholder{color:var(--faint)}
.toolbar input:focus,.toolbar select:focus{outline:1px solid var(--amber);border-color:var(--amber)}
.toolbar input{width:260px}
.toolbar .count{color:var(--muted);margin-left:auto;font-size:13px}
.toolbar button{border:1px solid var(--amber);background:transparent;border-radius:3px;padding:7px 12px;font:inherit;cursor:pointer;color:var(--amber);font-weight:600}
.toolbar button:hover{background:var(--amber);color:#000}
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:calc(100vh - 260px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--raise);color:var(--amber);font-weight:600;font-size:12px;letter-spacing:.02em;text-align:left;padding:10px 12px;cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid var(--line)}
th:hover{color:#ffb066}
th.num{text-align:right}
th .arrow{opacity:.4;margin-left:4px;font-size:10px}
th.sorted{color:#fff}
th.sorted .arrow{opacity:1;color:var(--amber)}
td{padding:8px 12px;border-bottom:1px solid #1d1d1d;white-space:nowrap}
td.num{text-align:right}
td.neg{color:var(--neg)}
td.na{color:var(--faint)}
td:first-child{font-weight:550;color:#fff}
tbody tr:nth-child(even) td{background:#0b0b0b}
tbody tr:hover td{background:var(--amber-soft)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.notes{margin-top:28px;color:var(--muted);font-size:12.5px}
.notes b{color:var(--text)}
.notes ol{padding-left:18px;margin:6px 0 0}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#333;border-radius:5px}::-webkit-scrollbar-track{background:transparent}
@media (max-width:640px){.wrap{padding:0 16px}.toolbar input{width:100%}.toolbar .count{margin-left:0}}
:root{--pos:#3ec46d}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.headline{font-size:22px;font-weight:650;color:#fff;margin:0 0 6px;max-width:980px;line-height:1.3}
.stamp{color:var(--faint);font-size:12px;margin-bottom:18px}
.fbnote{color:var(--faint);font-size:10.5px;margin:-4px 0 4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:22px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.tile .k{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .c{font-size:12.5px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.panel ul{margin:0;padding-left:18px}.panel li{margin-bottom:7px}
.note{display:grid;grid-template-columns:150px 64px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid #1d1d1d;align-items:baseline}
.note:last-child{border-bottom:0}
.note .nm{font-weight:600;color:#fff}.note .cd{color:var(--faint);font-size:12px;display:block}
.note .ch{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
@media (max-width:640px){.note{grid-template-columns:1fr 60px}.note .tx{grid-column:1/-1}}
.news{list-style:none;padding:0;margin:0}
.news li{padding:6px 0;border-bottom:1px solid #1d1d1d;display:grid;grid-template-columns:96px 1fr;gap:10px}
.news li:last-child{border-bottom:0}
.news .t{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.news .s{color:var(--faint);font-size:11.5px;margin-left:6px}
.stock-news h4{margin:12px 0 4px;font-size:13px;color:#fff}
.pdf-btn{margin-left:10px;border:1px solid var(--amber);background:var(--amber);color:#000;border-radius:3px;padding:4px 12px;font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;vertical-align:middle}
.pdf-btn:hover{background:#ffa142}
.src{display:inline-block;font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:1px 6px;margin-left:8px;vertical-align:middle}

nav a.group{margin-left:14px;position:relative}
nav a.group::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;border-left:1px solid #3a3a3a}
.hk-card .num{font-size:20px;line-height:1.3;color:#fff}
.alert{border:1px solid #7a2420;background:rgba(255,67,61,.1);color:#ffb3ad;border-radius:4px;padding:9px 12px;margin:0 0 14px;font-size:13px}
.alert span{color:#d98a85;font-size:12px}

.hk-brief{display:flex;flex-direction:column;gap:10px;height:calc(100vh - 190px);min-height:520px}
main.wrap.fit{padding-bottom:0}
.hk-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hk-top .headline{margin:0;font-size:19px;max-width:none}
.hk-top .stamp{margin:0}
.tiles.compact{grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin:0}
.tiles.compact .tile{padding:5px 8px}.tiles.compact .k{font-size:10.5px}
.tiles.compact .v{font-size:13px;margin-top:0}.tiles.compact .c{font-size:11.5px}
.hk-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px}
.hk-col{display:flex;flex-direction:column;gap:10px;min-height:0}
.hk-grid .panel{margin:0;padding:11px 14px;overflow:auto;min-height:0;font-size:13px}
.hk-col .panel{flex:1 1 0}
.hk-grid .panel h3{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-11px;background:var(--panel);padding:2px 0 6px;margin:0 0 4px;z-index:1}
.hk-grid .panel li{margin-bottom:5px}
.seg{display:inline-flex;gap:2px;text-transform:none;letter-spacing:0}
.seg button{background:transparent;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:11.5px;padding:2px 8px;border-radius:3px;cursor:pointer}
.seg button.on{background:var(--amber);border-color:var(--amber);color:#000;font-weight:600}
.hk-grid .note{grid-template-columns:132px 54px 1fr;padding:6px 0}
.row-all{display:grid;grid-template-columns:1fr 56px 56px 34px;gap:8px;padding:5px 0;border-bottom:1px solid #1d1d1d;align-items:baseline;font-variant-numeric:tabular-nums}
.row-all span:not(:first-child){text-align:right}
.stock-link{cursor:pointer;color:#fff;font-weight:600}
.stock-link:hover{color:var(--amber);text-decoration:underline}
.news-n{color:var(--amber);font-size:11.5px}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:#0b0b0b;border-left:2px solid var(--amber);z-index:21;overflow:auto;padding:20px 24px 32px}
.drawer h2{margin:0;color:#fff}.drawer .sub{color:var(--muted);font-size:12.5px;margin:2px 0 12px}
.drawer .x{position:absolute;top:14px;right:16px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:3px;font:inherit;padding:3px 9px;cursor:pointer}
.drawer .x:hover{color:#fff;border-color:var(--amber)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 14px}
.kv > div{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.kv .k{color:var(--muted);font-size:10.5px}.kv .v{font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px}
.drawer .panel{margin-bottom:12px}
@media (max-width:1000px){.hk-brief{height:auto}.hk-grid{grid-template-columns:1fr}.hk-grid .panel{overflow:visible}
  .tiles.compact{grid-template-columns:repeat(4,1fr)}.kv{grid-template-columns:repeat(2,1fr)}}
</style>

const NUM = new Set(["usd_bn","usd_m","pct","ratio","mult"]);
const DIGITS = {usd_bn:1,usd_m:1,pct:1,ratio:1,mult:1};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtVal = (v, f) => v === null ? "–" : NUM.has(f) ? v.toLocaleString("en-US",{minimumFractionDigits:DIGITS[f],maximumFractionDigits:DIGITS[f]}) + (f === "mult" ? "x" : "") : esc(v);
const pct = v => { if(v === null || v === undefined) return "–"; const r = Math.round(v * 10) / 10 || 0;
  return `${r > 0 ? "+" : ""}${r.toFixed(1)}%`; };
const cls = v => { const r = Math.round((v ?? 0) * 10) / 10; return r > 0 ? "pos" : r < 0 ? "neg" : ""; };
const numf = (v, d=1) => v === null || v === undefined ? "–" : v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const HK = D.hk, HKS = HK ? HK.sessions : {};
const HK_LATEST = HK ? (HKS.close || HKS.open) : null;

// ---------- header, run picker, tabs
document.getElementById("meta").textContent = `Run ${D.asOf} · Source: LSEG Workspace` +
  (D.screensAsOf ? ` · Screens ${D.screensAsOf}` : "") + (HK ? ` · HK ${HK.dateLabel}` : "");
const runs = document.getElementById("runs");
const IN_RUNS = /\/runs\/[^/]*$/.test(location.pathname);  // same page serves index.html and runs/DATE.html
const runHref = d => (IN_RUNS ? "" : "runs/") + d + ".html";
runs.innerHTML = D.runs.map((d,i) => `<option value="${runHref(d)}" ${d===D.runDate?"selected":""}>${d}${i===0?" (latest)":""}</option>`).join("");
runs.onchange = () => { location.href = runs.value + location.hash; };

const TABS = [{key:"summary", title:"Summary"}]
  .concat(D.screens.map(s => ({key:s.key, title:s.title, n: s.error && !s.stale ? "!" : s.rows.length})))
  .concat(HK ? [{key:"hk-open", title:"HK Pre-open", group:true, off:!HKS.open},
                {key:"hk-close", title:"HK Close", off:!HKS.close},
                {key:"hk-watchlist", title:"HK Watchlist"}] : []);
function nav(active){
  document.getElementById("nav").innerHTML = TABS.map(t =>
    `<a href="#${t.key}" class="${t.key===active?"active":""} ${t.group?"group":""}" style="${t.off?"opacity:.45":""}">${esc(t.title)}${t.n!==undefined?`<span class="n">${t.n}</span>`:""}</a>`).join("");
}

// ---------- summary
function summary(){
  const cards = D.screens.map(s => {
    const top = s.rows.slice(0,5).map(r => esc(r[0] ?? r[1])).join("<br>") || "None this run";
    return `<a class="card" href="#${s.key}"><h3>${esc(s.title)}</h3>
      ${s.error ? `<div class="alert" style="margin:0">${s.stale ? `Latest run failed; showing ${esc(s.stale)}` : "Failed on the latest run"}</div>` : ""}
      <div class="num">${s.error && !s.stale ? "–" : s.rows.length}<small>companies</small></div>
      <div class="thesis" style="margin:0">${esc(s.thesis)}</div>
      <ul>${s.criteria.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
      <div class="top-names"><b>Top names by ${esc(s.sort.label)}</b>${top}</div>
      <span class="open">View all →</span></a>`;
  });
  if(HK_LATEST){
    const key = HKS.close ? "hk-close" : "hk-open", c = HK_LATEST.commentary;
    cards.push(`<a class="card hk-card" href="#${key}"><h3>HK Watchlist · ${HKS.close ? "Close wrap" : "Pre-open brief"}</h3>
      <div class="num">${esc(c.headline)}</div>
      <div class="thesis" style="margin:0">${esc(HK_LATEST.generated_at)} · ${HK.count} names</div>
      <ul>${c.summary.slice(0,3).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <span class="open">Read the brief →</span></a>`);
  }
  return `<div class="cards">${cards.join("")}</div>
    <div class="notes"><b>Notes</b><ol>
      <li>Screens are a starting point for research, not recommendations. Each result needs fundamental review.</li>
      <li>Market data is as of the run date. Free cash flow is last twelve months; ROIC and ROE are by fiscal year.</li>
      <li>Companies missing any required data point are excluded rather than estimated.</li>
    </ol></div>`;
}

// ---------- screens
const state = {};
function getState(s){
  if(!state[s.key]){
    const col = Math.max(0, s.columns.findIndex(c => c.label === s.sort.label));
    state[s.key] = {q:"", country:"", sector:"", col, dir:s.sort.dir};
  }
  return state[s.key];
}
function filtered(s){
  const st = getState(s), q = st.q.toLowerCase();
  const ci = s.columns.findIndex(c=>c.label==="Country"), si = s.columns.findIndex(c=>c.label==="GICS Sector");
  const rows = s.rows.filter(r =>
    (!q || r.some(v => v !== null && String(v).toLowerCase().includes(q))) &&
    (!st.country || r[ci] === st.country) && (!st.sector || r[si] === st.sector));
  const f = s.columns[st.col].fmt, k = st.dir === "asc" ? 1 : -1;
  return rows.sort((a,b) => { const x=a[st.col], y=b[st.col];
    if(x===null) return 1; if(y===null) return -1;
    return (NUM.has(f) ? x-y : String(x).localeCompare(String(y))) * k; });
}
function options(s, label, current){
  const i = s.columns.findIndex(c=>c.label===label);
  const vals = [...new Set(s.rows.map(r=>r[i]).filter(v=>v!==null))].sort();
  return `<option value="">All ${label==="Country"?"countries":"sectors"}</option>` +
    vals.map(v=>`<option ${v===current?"selected":""}>${esc(v)}</option>`).join("");
}
function screenAlert(s){
  if(!s.error) return "";
  return `<div class="alert">${s.stale ? `This screen failed on the latest run, so these are the results from <b>${esc(s.stale)}</b>.`
    : "This screen failed on the latest run and has no earlier results yet."}<br><span>Error: ${esc(s.error)}</span></div>`;
}
function screenView(s){
  const st = getState(s);
  return `<h2>${esc(s.title)}</h2><p class="thesis">${esc(s.thesis)}</p>${screenAlert(s)}
    <div class="chips">${s.criteria.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search company, RIC, country, holder…" value="${esc(st.q)}">
      <select id="country">${options(s,"Country",st.country)}</select>
      <select id="sector">${options(s,"GICS Sector",st.sector)}</select>
      <span class="count" id="count"></span><button id="csv">Download CSV</button>
    </div><div class="table-wrap" id="table"></div>`;
}
function renderScreen(s){
  const st = getState(s), rows = filtered(s);
  document.getElementById("count").textContent = `${rows.length} of ${s.rows.length} companies`;
  if(!s.rows.length){ document.getElementById("table").innerHTML = `<div class="empty">${s.error ? "No results to show." : "No companies met all criteria on this run."}</div>`; return; }
  const head = s.columns.map((c,i) => `<th data-i="${i}" class="${NUM.has(c.fmt)?"num":""} ${i===st.col?"sorted":""}">${esc(c.label)}<span class="arrow">${i===st.col?(st.dir==="asc"?"▲":"▼"):"↕"}</span></th>`).join("");
  const body = rows.map(r => `<tr>${r.map((v,i)=>{const f=s.columns[i].fmt;
    return `<td class="${[NUM.has(f)?"num":"", v===null?"na":"", NUM.has(f)&&v<0?"neg":""].join(" ")}">${fmtVal(v,f)}</td>`;}).join("")}</tr>`).join("");
  document.getElementById("table").innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${s.columns.length}" class="empty">No matches for these filters.</td></tr>`}</tbody></table>`;
  document.querySelectorAll("th").forEach(th => th.onclick = () => { const i = +th.dataset.i;
    if(st.col === i) st.dir = st.dir === "asc" ? "desc" : "asc"; else { st.col = i; st.dir = NUM.has(s.columns[i].fmt) ? "desc" : "asc"; }
    renderScreen(s); });
}
function downloadBlob(bytes, type, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], {type})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function downloadCsv(s){
  const cell = v => v === null ? "" : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : String(v);
  const lines = [s.columns.map(c=>cell(c.label)).join(",")].concat(filtered(s).map(r=>r.map(cell).join(",")));
  downloadBlob(lines.join("\n"), "text/csv", `${s.key}_${D.runDate}.csv`);
}

// ---------- HK briefs
function tiles(macro, compact){
  return `<div class="tiles ${compact ? "compact" : ""}">${macro.map(m => `<div class="tile"><div class="k">${esc(m.name)}${m.src==="yahoo"?"<sup>*</sup>":""}</div>
    <div class="v">${m.last===null?"–":numf(m.last, m.last<20?3:1)}</div><div class="c ${cls(m.chg)}">${pct(m.chg)}</div></div>`).join("")}</div>`;
}
const list = items => items && items.length ? `<ul>${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>` : `<p class="thesis">Nothing notable.</p>`;
const newsList = items => items && items.length ? `<ul class="news">${items.map(n=>`<li><span class="t">${esc(n.time)}</span><span>${esc(n.headline)}<span class="s">${esc(n.source)}</span></span></li>`).join("")}</ul>` : `<p class="thesis">No headlines in this window.</p>`;
function downloadPdf(key){
  const p = HKS[key].pdf, bin = atob(p.b64), bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  downloadBlob(bytes, "application/pdf", p.name);
}
const hkUI = {left:"notes", right:"world"};
const link = (ric, name) => `<span class="stock-link" data-ric="${esc(ric)}">${esc(name || ric)}</span>`;
const seg = (side, val, label) => `<button data-seg="${side}:${val}" class="${hkUI[side]===val?"on":""}">${label}</button>`;
function sessionMove(b, s){ return b.session === "open" && s.proxy_chg !== null && s.proxy_chg !== undefined ? s.proxy_chg : s.chg_1d; }
function hkLeft(b){
  const byRic = Object.fromEntries(b.stocks.map(s => [s.ric, s]));
  if(hkUI.left === "all"){
    const rows = [...b.stocks].sort((x,y) => (y.chg_1d ?? -1e9) - (x.chg_1d ?? -1e9));
    return `<div class="row-all" style="color:var(--faint);font-size:11px"><span>Name</span><span>1D</span><span>5D</span><span>News</span></div>` +
      rows.map(s => `<div class="row-all"><span>${link(s.ric, s.name)}</span><span class="${cls(s.chg_1d)}">${pct(s.chg_1d)}</span>
        <span class="${cls(s.chg_5d)}">${pct(s.chg_5d)}</span><span class="news-n">${(s.news||[]).length || ""}</span></div>`).join("");
  }
  const c = b.commentary;
  if(!c.stocks.length) return `<p class="thesis">No stock-specific moves or news worth flagging.</p>`;
  return c.stocks.map(n => { const s = byRic[n.ric] || {}, move = sessionMove(b, s);
    return `<div class="note"><span>${link(n.ric, s.name)}<span class="cd">${esc(n.ric)}${b.session==="open" && s.proxy_name ? " · " + esc(s.proxy_name) : ""}</span></span>
      <span class="ch ${cls(move)}">${pct(move)}</span><span class="tx">${esc(n.note)}</span></div>`; }).join("");
}
function hkRight(b){
  if(hkUI.right === "world") return newsList(b.world_news.slice(0,15));
  if(hkUI.right === "china") return newsList(b.china_news.slice(0,15));
  const withNews = b.stocks.filter(s => s.news && s.news.length);
  if(!withNews.length) return `<p class="thesis">No company headlines in this window.</p>`;
  return `<ul class="news">${withNews.flatMap(s => s.news.map(n => `<li><span class="t">${esc(n.time)}</span>
    <span>${link(s.ric, s.name)} · ${esc(n.headline)}<span class="s">${esc(n.source)}</span></span></li>`)).join("")}</ul>`;
}
function hkBrief(key){
  const b = HKS[key];
  if(!b) return `<div class="empty">The HK ${key === "open" ? "pre-open brief" : "close wrap"} for ${esc(HK.dateLabel)} hasn't been run yet.<br>Run <code>python screener.py --hk ${key} --publish</code>.</div>`;
  const c = b.commentary;
  const src = b.commentary_source === "rules" ? "Automatic summary (no LLM)" : `Commentary: ${esc(b.commentary_source)}`;
  const implied = key === "open" && b.implied_open_pct !== null ? ` · HSI futures imply <span class="${cls(b.implied_open_pct)}">${pct(b.implied_open_pct)}</span> open` : "";
  const nNews = b.stocks.filter(s => s.news && s.news.length).length;
  return `<div class="hk-brief">
    <div class="hk-top"><p class="headline">${esc(c.headline)}</p>
      <span class="stamp">HK ${key==="open"?"pre-open brief":"close wrap"} · ${esc(b.generated_at)}${implied}<span class="src">${src}</span></span>
      ${b.pdf ? `<button class="pdf-btn" onclick="downloadPdf('${key}')">Download PDF</button>` : ""}</div>
    ${tiles(b.macro, true)}
    ${b.fallback_note ? `<div class="fbnote">${esc(b.fallback_note)}</div>` : ""}
    <div class="hk-grid">
      <div class="hk-col">
        <div class="panel"><h3>${key==="open"?"Overnight":"Session"}</h3>${list(c.summary)}</div>
        <div class="panel"><h3>World &amp; China</h3>${list(c.world)}</div>
        <div class="panel" style="flex:.7 1 0"><h3>${key==="open"?"Watch today":"Watch overnight"}</h3>${list(c.watch)}</div>
      </div>
      <div class="panel"><h3>Stocks <span class="seg">${seg("left","notes",`Notes (${c.stocks.length})`)}${seg("left","all",`All ${b.stocks.length}`)}</span></h3>
        <div id="hk-left">${hkLeft(b)}</div></div>
      <div class="panel"><h3>Headlines <span class="seg">${seg("right","world","World")}${seg("right","china","China &amp; HK")}${seg("right","company",`Companies (${nNews})`)}</span></h3>
        <div id="hk-right">${hkRight(b)}</div></div>
    </div></div>`;
}

// ---------- stock drawer (click any name)
function findStock(ric, sessionKey){
  const b = (sessionKey && HKS[sessionKey]) || HK_LATEST;
  return b ? {b, s: b.stocks.find(x => x.ric === ric)} : {};
}
function showDrawer(ric, sessionKey){
  closeDrawer(true);
  const {b, s} = findStock(ric, sessionKey);
  if(!s) return;
  const note = (b.commentary.stocks.find(n => n.ric === ric) || {}).note;
  const kv = (k, v, c="") => `<div><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
  const price = s.last === null || s.last === undefined ? "–" : (+s.last).toLocaleString("en-US",{maximumFractionDigits: s.last < 10 ? 3 : 1, minimumFractionDigits:1});
  const el = document.createElement("div");
  el.innerHTML = `<div class="drawer-bg" id="drawer-bg"></div>
  <aside class="drawer" role="dialog" aria-label="${esc(s.name)}">
    <button class="x" id="drawer-x">Close ✕</button>
    <h2>${esc(s.name)}</h2>
    <div class="sub">${esc(s.ric)} · ${esc(s.country || "–")} · ${esc(s.sector || "–")} · ${b.session === "open" ? "pre-open" : "close"} data, ${esc(b.generated_at)}</div>
    <div class="kv">
      ${kv("Last (HKD)", price)}${kv("1D", pct(s.chg_1d), cls(s.chg_1d))}${kv("5D", pct(s.chg_5d), cls(s.chg_5d))}${kv("1M", pct(s.chg_1m), cls(s.chg_1m))}
      ${kv("YTD", pct(s.chg_ytd), cls(s.chg_ytd))}${kv("Vol / 20D", s.vol_ratio === null ? "–" : numf(s.vol_ratio) + "x")}${kv("52W range", s.pos_52w === null ? "–" : numf(s.pos_52w) + "%")}${kv("Mkt cap", s.mcap_bn === null ? "–" : "$" + numf(s.mcap_bn) + "bn")}
      ${kv("ADV 30D", s.adv_m === null ? "–" : "$" + numf(s.adv_m) + "m")}${kv("P/E", s.pe === null ? "–" : numf(s.pe) + "x")}${kv("Div yield", s.div_yield === null ? "–" : numf(s.div_yield) + "%")}${kv(s.proxy_name ? esc(s.proxy_name) : "US proxy", pct(s.proxy_chg), cls(s.proxy_chg))}
    </div>
    ${s.holder ? `<div class="panel"><h3>Largest holder</h3>${esc(s.holder)}${s.holder_pct !== null ? ` · ${numf(s.holder_pct)}% of shares` : ""}</div>` : ""}
    ${s.link_name ? `<div class="panel"><h3>Linked commodity</h3>${esc(s.link_name)} <span class="${cls(s.link_chg)}">${pct(s.link_chg)}</span></div>` : ""}
    <div class="panel"><h3>Commentary</h3>${note ? esc(note) : `<span class="thesis">Not flagged in this ${b.session === "open" ? "brief" : "wrap"}.</span>`}</div>
    <div class="panel"><h3>Headlines</h3>${newsList(s.news)}</div>
  </aside>`;
  el.id = "drawer";
  document.body.appendChild(el);
  document.getElementById("drawer-bg").onclick = () => leaveStock();
  document.getElementById("drawer-x").onclick = () => leaveStock();
}
function closeDrawer(){ const d = document.getElementById("drawer"); if(d) d.remove(); }
function leaveStock(){ const [key] = location.hash.slice(1).split("/"); location.hash = key; }
document.addEventListener("keydown", e => { if(e.key === "Escape" && document.getElementById("drawer")) leaveStock(); });
document.getElementById("main").addEventListener("click", e => {
  const segBtn = e.target.closest("[data-seg]");
  if(segBtn){
    const [side, val] = segBtn.dataset.seg.split(":"); hkUI[side] = val;
    const key = location.hash.slice(1).split("/")[0], b = HKS[key.replace("hk-","")];
    if(b){ document.getElementById(side === "left" ? "hk-left" : "hk-right").innerHTML = side === "left" ? hkLeft(b) : hkRight(b);
      segBtn.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === segBtn)); }
    return;
  }
  const st = e.target.closest("[data-ric]");
  if(st){ const key = location.hash.slice(1).split("/")[0] || "hk-watchlist"; location.hash = `${key}/${st.dataset.ric}`; }
});

// ---------- HK watchlist table
const COLS = [
  {k:"name",l:"Company",t:"text"},{k:"ric",l:"RIC",t:"text"},{k:"country",l:"Country",t:"text"},
  {k:"sector",l:"GICS Sector",t:"text"},{k:"last",l:"Last (HKD)",t:"price"},{k:"chg_1d",l:"1D",t:"pct"},
  {k:"chg_5d",l:"5D",t:"pct"},{k:"chg_1m",l:"1M",t:"pct"},{k:"chg_ytd",l:"YTD",t:"pct"},
  {k:"mcap_bn",l:"Mkt cap ($bn)",t:"num",d:1},{k:"adv_m",l:"ADV 30D ($m)",t:"num",d:1},
  {k:"vol_ratio",l:"Vol / 20D",t:"num",d:1},{k:"pos_52w",l:"52W range %",t:"num",d:1},
  {k:"proxy_chg",l:"US proxy o/n",t:"pct"},{k:"pe",l:"P/E",t:"num",d:1},{k:"div_yield",l:"Div yld %",t:"num",d:1},
  {k:"holder",l:"Largest holder",t:"text"},{k:"holder_pct",l:"Holder %",t:"num",d:1},
  {k:"newsCount",l:"News",t:"num",d:0}];
const ws = {col:5, dir:"desc", q:""};
function hkWatchlist(){
  if(!HK_LATEST) return `<div class="empty">No HK data yet.</div>`;
  return `<h2>HK Watchlist</h2><p class="thesis">${HK.count} Hong Kong names, from the ${HKS.close ? "close" : "pre-open"} run, ${esc(HK_LATEST.generated_at)}.</p>
    <div class="toolbar"><input id="q" type="search" placeholder="Search name, code, country, sector, holder…" value="${esc(ws.q)}">
    <span class="count" id="count"></span></div><div class="table-wrap" id="table"></div>
    <div class="notes">"US proxy o/n" is the overnight move in the US-listed shares or US parent. 52W range %: 0 = at the 52-week low, 100 = at the high.</div>`;
}
function renderWatchlist(){
  const q = ws.q.toLowerCase(), c = COLS[ws.col], k = ws.dir === "asc" ? 1 : -1;
  const rows = HK_LATEST.stocks.map(s => ({...s, newsCount: (s.news||[]).length}))
    .filter(s => !q || [s.name,s.ric,s.code,s.country,s.sector,s.holder].some(v => String(v||"").toLowerCase().includes(q)))
    .sort((a,b) => { const x=a[c.k], y=b[c.k]; if(x===null||x===undefined||x==="") return 1; if(y===null||y===undefined||y==="") return -1;
      return (c.t==="text" ? String(x).localeCompare(String(y)) : x-y) * k; });
  document.getElementById("count").textContent = `${rows.length} of ${HK_LATEST.stocks.length} stocks`;
  const head = COLS.map((col,i) => `<th data-i="${i}" class="${col.t!=="text"?"num":""} ${i===ws.col?"sorted":""}">${col.l}<span class="arrow">${i===ws.col?(ws.dir==="asc"?"▲":"▼"):"↕"}</span></th>`).join("");
  const body = rows.map(s => `<tr>${COLS.map(col => { const v = s[col.k];
    if(col.k==="name") return `<td>${link(s.ric, s.name)}</td>`;
    if(col.t==="text") return `<td>${esc(v||"–")}</td>`;
    if(col.t==="pct") return `<td class="num ${cls(v)}">${pct(v)}</td>`;
    if(col.t==="price") return `<td class="num ${v===null||v===undefined?"na":""}">${v===null||v===undefined?"–":(+v).toLocaleString("en-US",{maximumFractionDigits: v < 10 ? 3 : 1, minimumFractionDigits: 1})}</td>`;
    return `<td class="num ${v===null||v===undefined?"na":""}">${numf(v, col.d)}</td>`; }).join("")}</tr>`).join("");
  document.getElementById("table").innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  document.querySelectorAll("th").forEach(th => th.onclick = () => { const i=+th.dataset.i;
    if(ws.col===i) ws.dir = ws.dir==="asc"?"desc":"asc"; else { ws.col=i; ws.dir = COLS[i].t==="text"?"asc":"desc"; } renderWatchlist(); });
}

// ---------- router
let shown = null;
function route(){
  let [key, ric] = location.hash.slice(1).split("/");
  if(!TABS.some(t => t.key === key)) key = "summary";
  if(shown === key && key.startsWith("hk-")){  // same tab: just open/close the stock drawer
    if(ric) showDrawer(decodeURIComponent(ric), key.replace("hk-","")); else closeDrawer();
    return;
  }
  shown = key;
  closeDrawer();
  nav(key);
  const main = document.getElementById("main"), s = D.screens.find(x => x.key === key);
  main.classList.remove("fit");
  if(s){
    main.innerHTML = screenView(s);
    const st = getState(s);
    document.getElementById("q").oninput = e => { st.q = e.target.value; renderScreen(s); };
    document.getElementById("country").onchange = e => { st.country = e.target.value; renderScreen(s); };
    document.getElementById("sector").onchange = e => { st.sector = e.target.value; renderScreen(s); };
    document.getElementById("csv").onclick = () => downloadCsv(s);
    renderScreen(s);
  } else if(key === "hk-open" || key === "hk-close"){
    main.innerHTML = hkBrief(key.slice(3));
    main.classList.add("fit"); fitBrief();
  } else if(key === "hk-watchlist"){
    main.innerHTML = hkWatchlist();
    if(HK_LATEST){ document.getElementById("q").oninput = e => { ws.q = e.target.value; renderWatchlist(); }; renderWatchlist(); }
  } else {
    main.innerHTML = summary();
  }
  window.scrollTo(0,0);
  if(ric && key.startsWith("hk-")) showDrawer(decodeURIComponent(ric), key.replace("hk-",""));
}
function fitBrief(){  // size the brief to exactly the space left in the window
  const el = document.querySelector(".hk-brief");
  if(!el) return;
  if(window.innerWidth <= 1000){ el.style.height = ""; return; }
  el.style.height = Math.max(520, window.innerHeight - el.getBoundingClientRect().top - window.scrollY - 14) + "px";
}
window.addEventListener("resize", fitBrief);
window.addEventListener("hashchange", route);
route();
</script>
