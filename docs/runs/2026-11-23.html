const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:bytes(P.s), iterations:P.n, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);

async function unlock(pw){

  return true;
}
const f = document.getElementById("f"), pw = document.getElementById("pw"),
      btn = document.getElementById("go"), err = document.getElementById("err");
f.onsubmit = async e => {
  e.preventDefault(); btn.disabled = true; err.textContent = "";
  if(!(await unlock(pw.value))){ err.textContent = "Wrong password."; btn.disabled = false; pw.select(); }
};
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch(e) {}
  if(saved && await unlock(saved)) return;
  try { sessionStorage.removeItem(KEY); } catch(e) {}
  f.hidden = false; pw.focus();
})();
</script>
</body>
