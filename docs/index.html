const state = {};
const NUM = new Set(["usd_bn","pct","ratio"]);
const DIGITS = {usd_bn:1,pct:1,ratio:2};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtVal = (v, f) => v === null ? "–" : NUM.has(f) ? v.toLocaleString("en-US",{minimumFractionDigits:DIGITS[f],maximumFractionDigits:DIGITS[f]}) : esc(v);

document.getElementById("meta").textContent =
  `Run ${DATA.asOf} · Active, listed, primary-line equities worldwide · Source: LSEG Workspace · USD`;
const runs = document.getElementById("runs");
runs.innerHTML = DATA.runs.map(r => `<option value="${r.href}" ${r.date===DATA.runDate?"selected":""}>${r.date}${r===DATA.runs[0]?" (latest)":""}</option>`).join("");
runs.onchange = () => { location.href = runs.value + location.hash; };

function nav(active){
  const tabs = [{key:"summary",title:"Summary"}].concat(DATA.screens);
  document.getElementById("nav").innerHTML = tabs.map(t =>
    `<a href="#${t.key}" class="${t.key===active?"active":""}">${esc(t.title)}${t.rows?`<span class="n">${t.rows.length}</span>`:""}</a>`).join("");
}

function summary(){
  const cards = DATA.screens.map(s => {
    const top = s.rows.slice(0,5).map(r => esc(r[0] ?? r[1])).join("<br>") || "None this run";
    return `<a class="card" href="#${s.key}">
      <h3>${esc(s.title)}</h3>
      <div class="num">${s.rows.length}<small>companies</small></div>
      <div class="thesis" style="margin:0">${esc(s.thesis)}</div>
      <ul>${s.criteria.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
      <div class="top-names"><b>Top names by ${esc(s.sort.label)}</b>${top}</div>
      <span class="open">View all →</span></a>`;
  }).join("");
  return `<div class="cards">${cards}</div>
    <div class="notes"><b>Notes</b><ol>
      <li>Screens are a starting point for research, not recommendations. Each result needs fundamental review.</li>
      <li>Market data is as of the run date. Free cash flow is last twelve months; ROIC is by fiscal year.</li>
      <li>Companies missing any required data point are excluded rather than estimated.</li>
    </ol></div>`;
}

function getState(s){
  if(!state[s.key]){
    const col = Math.max(0, s.columns.findIndex(c => c.label === s.sort.label));
    state[s.key] = {q:"", country:"", sector:"", col, dir:s.sort.dir};
  }
  return state[s.key];
}

function filtered(s){
  const st = getState(s), q = st.q.toLowerCase();
  const ci = s.columns.findIndex(c=>c.label==="Country"), si = s.columns.findIndex(c=>c.label==="Sector");
  const rows = s.rows.filter(r =>
    (!q || r.some(v => v !== null && String(v).toLowerCase().includes(q))) &&
    (!st.country || r[ci] === st.country) && (!st.sector || r[si] === st.sector));
  const f = s.columns[st.col].fmt, k = st.dir === "asc" ? 1 : -1;
  return rows.sort((a,b) => {
    const x=a[st.col], y=b[st.col];
    if(x===null) return 1; if(y===null) return -1;
    return (NUM.has(f) ? x-y : String(x).localeCompare(String(y))) * k;
  });
}

function options(s, label, current){
  const i = s.columns.findIndex(c=>c.label===label);
  const vals = [...new Set(s.rows.map(r=>r[i]).filter(v=>v!==null))].sort();
  return `<option value="">All ${label.toLowerCase()==="country"?"countries":"sectors"}</option>` +
    vals.map(v=>`<option ${v===current?"selected":""}>${esc(v)}</option>`).join("");
}

function screenView(s){
  const st = getState(s);
  return `<h2>${esc(s.title)}</h2><p class="thesis">${esc(s.thesis)}</p>
    <div class="chips">${s.criteria.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search company, RIC, country…" value="${esc(st.q)}">
      <select id="country">${options(s,"Country",st.country)}</select>
      <select id="sector">${options(s,"Sector",st.sector)}</select>
      <span class="count" id="count"></span>
      <button id="csv">Download CSV</button>
    </div>
    <div class="table-wrap" id="table"></div>`;
}

function renderTable(s){
  const st = getState(s), rows = filtered(s);
  document.getElementById("count").textContent = `${rows.length} of ${s.rows.length} companies`;
  if(!s.rows.length){ document.getElementById("table").innerHTML = `<div class="empty">No companies met all criteria on this run.</div>`; return; }
  const head = s.columns.map((c,i) => `<th data-i="${i}" class="${NUM.has(c.fmt)?"num":""} ${i===st.col?"sorted":""}">${esc(c.label)}<span class="arrow">${i===st.col?(st.dir==="asc"?"▲":"▼"):"↕"}</span></th>`).join("");
  const body = rows.map(r => `<tr>${r.map((v,i)=>{const f=s.columns[i].fmt;
    const cls=[NUM.has(f)?"num":"", v===null?"na":"", NUM.has(f)&&v<0?"neg":""].join(" ");
    return `<td class="${cls}">${fmtVal(v,f)}</td>`;}).join("")}</tr>`).join("");
  document.getElementById("table").innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${s.columns.length}" class="empty">No matches for these filters.</td></tr>`}</tbody></table>`;
  document.querySelectorAll("th").forEach(th => th.onclick = () => {
    const i = +th.dataset.i;
    if(st.col === i) st.dir = st.dir === "asc" ? "desc" : "asc";
    else { st.col = i; st.dir = NUM.has(s.columns[i].fmt) ? "desc" : "asc"; }
    renderTable(s);
  });
}

function downloadCsv(s){
  const cell = v => v === null ? "" : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : String(v);
  const lines = [s.columns.map(c=>cell(c.label)).join(",")].concat(filtered(s).map(r=>r.map(cell).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], {type:"text/csv"}));
  a.download = `${s.key}_${DATA.runDate}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

function route(){
  const key = location.hash.slice(1) || "summary";
  const s = DATA.screens.find(x => x.key === key);
  nav(s ? key : "summary");
  const main = document.getElementById("main");
  if(!s){ main.innerHTML = summary(); return; }
  main.innerHTML = screenView(s);
  const st = getState(s);
  document.getElementById("q").oninput = e => { st.q = e.target.value; renderTable(s); };
  document.getElementById("country").onchange = e => { st.country = e.target.value; renderTable(s); };
  document.getElementById("sector").onchange = e => { st.sector = e.target.value; renderTable(s); };
  document.getElementById("csv").onclick = () => downloadCsv(s);
  renderTable(s);
}
window.addEventListener("hashchange", route);
route();
